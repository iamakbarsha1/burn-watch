name: Release Agent Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-save

      # bun --compile cross-compiles every target from one host, so there is no
      # build matrix to keep in step with the four build scripts or with the
      # assets the install scripts go looking for.
      - name: Build binaries
        working-directory: apps/agent
        run: |
          bun run build:darwin-arm64
          bun run build:darwin-x64
          bun run build:linux-x64
          bun run build:windows-x64

      # Hashed from the same bytes that get uploaded. v0.2.0 shipped a
      # checksums.txt written by hand against a different build of the Linux
      # binary, so install.sh correctly refused the release on every Linux box.
      - name: Checksums
        working-directory: apps/agent/dist
        run: |
          chmod +x burnwatch-*
          sha256sum burnwatch-* > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/agent/dist/burnwatch-darwin-arm64
            apps/agent/dist/burnwatch-darwin-x64
            apps/agent/dist/burnwatch-linux-x64
            apps/agent/dist/burnwatch-windows-x64.exe
            apps/agent/dist/checksums.txt
