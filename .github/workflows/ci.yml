name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps for the better-auth / drizzle-orm peer
      # conflict, so plain `npm ci` picks it up.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npx turbo run typecheck test
