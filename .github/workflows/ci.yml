name: CI

# mongo-migration is the integration branch phases 3 through 7 stack on, and
# it does not reach main until the Phase 8 cutover. Without it named here the
# whole migration merges with no CI at all, and the first run would be the one
# that takes main with it.
on:
  pull_request:
    branches: [main, mongo-migration]
  push:
    branches: [main, mongo-migration]

jobs:
  check:
    runs-on: ubuntu-latest

    # The dashboard aggregations are the one thing in this repo that no unit
    # test can check. The route tests answer reads from a fake store that
    # ignores filters on purpose — one that honoured them would be a second,
    # unverified MongoDB — and the pipeline tests read stages as data, which
    # catches a missing $match and never a $group that sums the wrong field.
    # Without a server in CI, a flipped comparison or a wrong group key merges
    # on code review alone.
    #
    # A standalone is enough: these are plain reads with no transaction.
    # packages/db's snapshot-race needs a replica set and stays out of CI.
    # mongo:8 refuses to boot on the current runner image: "Linux kernel
    # versions 6.19 and newer has a known incompatibility with this version of
    # MongoDB" (SERVER-121912). Pinned to the 9 series, which carries the fix.
    # The server version here only has to run the aggregations; the driver in
    # packages/db is what the app is actually coupled to.
    services:
      mongo:
        image: mongo:9
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps for the better-auth / drizzle-orm peer
      # conflict, so plain `npm ci` picks it up.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npx turbo run typecheck test

      # apps/api resolves @burn-watch/db through packages/db/dist, never src,
      # so this needs a build to exist. `turbo run test` already depends on
      # ^build and leaves one behind; naming it here is a cached no-op that
      # keeps the step runnable on its own, and keeps the dependency visible to
      # whoever reorders these steps next.
      - name: Build the db package
        run: npx turbo run build --filter=@burn-watch/db

      - name: Dashboard aggregations against a real MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/burnwatch_ci
          BW_DASHBOARD_ALLOW_WRITES: '1'
        run: npm run dashboard-pipelines -w @burn-watch/api
